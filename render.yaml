databases:
  - name: grocery-delivery-db
    plan: free
    databaseName: grocery_delivery
    user: grocery_user

services:
  - type: web
    name: grocery-delivery-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grocery-delivery-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
